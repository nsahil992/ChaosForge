apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: chaosforge-servicemonitor
  namespace: monitoring

  labels:
    release: prometheus

spec:
  selector:
    matchLabels:
      app: chaosforge

  namespaceSelector:
    matchNames:
      - chaosforge
  endpoints:
    - port: http
      path: /metrics
      interval: 15s